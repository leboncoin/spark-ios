# Runner info : https://github.com/actions/runner-images
# Macos runner info : https://github.com/actions/runner-images/tree/main/images/macos
# Local Documentation : https://github.com/leboncoin/spark-ios/blob/main/docs/WORKFLOW_BUILD_AND_TEST.md

name: ⚒️ Build and test

on:
  pull_request:
    types: [opened, edited, synchronize]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  swift_version: "6.2"
  xcode_path: "/Applications/Xcode_26.3.app"
  demo_app_name: SparkDemoApp

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - name: "Package name"
        run: echo "Build all packages at ${{ github.workspace }}"
      - name: Set Swift Version
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: ${{ env.swift_version }}
      - name: Get swift version
        run: swift --version
      - name: Select Xcode
        run: sudo xcode-select -s ${{ env.xcode_path }}
      - name: Checkout Action
        uses: actions/checkout@v6
      - name: Get sourcery
        run: |
          brew install sourcery
      - name: Build
        run: make build

  test:
    name: Tests
    runs-on: macos-26
    steps:
      - name: "Package name"
        run: echo "Test all packages at ${{ github.workspace }}"
      - name: Set Swift Version
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: ${{ env.swift_version }}
      - name: Get swift version
        run: swift --version
      - name: Select Xcode
        run: sudo xcode-select -s ${{ env.xcode_path }}
      - name: Checkout Action
        uses: actions/checkout@v6
      - name: Get sourcery
        run: |
          brew install sourcery
      - name: Test
        timeout-minutes: 30
        run: make test

  build-demo-app:
    name: Build Demo App
    runs-on: macos-26
    steps:
      - name: Select Xcode
        run: sudo xcode-select -s ${{ env.xcode_path }}
      - name: Checkout Action
        uses: actions/checkout@v6
      - name: Run xcodegen
        uses: xavierLowmiller/xcodegen-action@1.2.2
        with:
          spec: project.yml
          version: "2.41.0"
      - name: Build
        run: make build-demo-app
      - name: Upload xcresult file
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: ${{ env.demo_app_name }}-${{ github.run_number }}.xcresult
          path: ${{ env.demo_app_name }}.xcresult
          retention-days: 15
