# Local Documentation : https://github.com/leboncoin/spark-ios/blob/main/docs/WORKFLOW_NIGHTLY_LIST_DEPRECATED_COMPONENTS.md

name: 📋 Nightly Get all Deprecated Components

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 23 * * *' # Daily at 11 P.M
  workflow_dispatch:
    
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  list-deprecated-components:
    name: List Deprecated Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6

      - name: List Dependencies structure
        run: ls -la Dependencies/

      - name: Run deprecated component listing script
        run: |
          chmod +x .script/list-deprecated-components.sh
          ./.script/list-deprecated-components.sh

      - name: Upload component list artifact
        uses: actions/upload-artifact@v6
        with:
          name: spark-deprecated-components-listing
          path: spark-deprecated-components-listing.json
          retention-days: 90