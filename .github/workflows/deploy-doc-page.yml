# Local Documentation : https://github.com/leboncoin/spark-ios/blob/main/docs/WORKFLOW_DEPLOY_DOC_PAGE.md

name: 📑 Deploy Documentation

on:
  release:
    types: [published]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  repo_name: ${{ github.event.repository.name }}
  doc_path: "docs"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-26
    steps:
      - name: Package names
        run: echo "Generate DocC packages at ${{ env.repo_name }}"
      - name: Checkout Action
        uses: actions/checkout@v6
      - name: Get sourcery
        run: |
          brew install sourcery
      - name: Create docs directory
        run: mkdir -p ${{ env.doc_path }}
      - name: Build DocC 
        run: make docc DOCC_OUTPUT_PATH=${{ env.doc_path }} HOSTING_BASE_PATH=${{ env.repo_name }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.doc_path }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
