name: 🌙 Nightly demo app

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0-4" # At 00:00 on every day-of-week from Sunday through Thursday

env:
  app_name: SparkDemoApp
  swift_version: "6.2"
  xcode_path: "/Applications/Xcode_26.6.app"
  derived_data_path: ".derivedData/"

jobs:
  build-demo-app:
    name: Generate the SparkDemo.app from the main branch
    runs-on: macos-26
    steps:
      - name: Set Swift Version
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: ${{ env.swift_version }}

      - name: Get swift version
        run: swift --version

      - name: Select Xcode
        run: sudo xcode-select -s ${{ env.xcode_path }}

      - name: Checkout Action
        uses: actions/checkout@v6

      - name: Run xcodegen
        uses: xavierLowmiller/xcodegen-action@1.2.2
        with:
          version: "2.41.0"

      - name: Build
        run: make build-demo-app

      - name: Upload xcresult file
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: ${{ env.app_name }}-${{ github.run_number }}.xcresult
          path: ${{ env.app_name }}.xcresult
          retention-days: 1

      - name: Upload demo app file
        uses: actions/upload-artifact@v6
        id: artifact-upload-step
        if: ${{ success() }}
        with:
          name: SparkMainDemo.app
          path: |
            ${{ env.derived_data_path }}Build/Products/Debug-iphonesimulator/${{ env.app_name }}.app
          retention-days: 7